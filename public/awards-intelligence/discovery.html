<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Screening Room</title>
    <meta name="description" content="Films worth following.">
    <meta property="og:title" content="The Screening Room">
    <meta property="og:description" content="Films worth following.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <base href="/screening-room/">
    <link rel="canonical" href="/screening-room/">
    <link rel="icon" href="awards-intelligence.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="discovery.css">
  </head>
  <body>
    <header class="site-header">
      <div class="brand-stack">
        <a class="portfolio-home-link" href="/">Return Home</a>
        <a class="wordmark" href="/screening-room/" data-route="home">
          <span class="brand-name">The Screening Room</span>
          <span class="brand-subtitle">Films worth following.</span>
        </a>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <button class="nav-link active" type="button" data-route="home">Spotlight</button>
        <button class="nav-link" type="button" data-route="discover" data-nav-view="all">Discover</button>
        <button class="nav-link" type="button" data-route="discover" data-nav-view="festivals">Festival Radar</button>
        <button class="nav-link" type="button" data-route="awards">Awards Intelligence</button>
        <button class="nav-link" type="button" data-route="about">About</button>
      </nav>
      <label class="quick-search sr-only-search" aria-hidden="true">
        <span>Search</span>
        <input id="globalSearch" aria-label="Search films" placeholder="Title, director, cast" tabindex="-1">
      </label>
    </header>
    <main class="app-shell">
      <section id="homeView"></section>
      <section id="discoverView" class="hidden"></section>
      <section id="aboutView" class="hidden"></section>
    </main>
    <aside id="hoverPreview" class="hover-preview" aria-live="polite"></aside>
    <div id="searchPanel" class="search-panel hidden" role="listbox" aria-label="Search suggestions"></div>
    <div id="modalScrim" class="modal-scrim hidden"></div>
    <section id="filmModal" class="film-modal hidden" role="dialog" aria-modal="true" aria-label="Film details"></section>
    <footer class="site-footer">
      <div>
        <strong>The Screening Room</strong>
        <span>Built by Amy Wilson</span>
      </div>
      <nav aria-label="Footer navigation">
        <a href="/screening-room/#about">About</a>
        <a href="/screening-room/#about">Methodology</a>
        <a href="/projects">Portfolio</a>
      </nav>
    </footer>
    <script src="analytics.js"></script>
    <script src="seo.js"></script>
    <script src="search-ui.js"></script>
    <script src="discovery-app.js"></script>
  </body>
</html>
